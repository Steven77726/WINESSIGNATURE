<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Démo cocktails — Winess Signature</title><style>*{box-sizing:border-box}body{margin:0;background:#100d10;color:#f4eeee;font-family:Arial,sans-serif}.page{max-width:1050px;margin:auto;padding:24px 14px;text-align:center}.back{color:#ddd0ce;text-decoration:none;font-size:13px}h1{font:italic 46px Georgia;margin:18px 0 5px;letter-spacing:1px}.sub{letter-spacing:3px;font-size:10px;color:#c6b6b2}.stage{height:min(66vh,590px);min-height:380px;position:relative;overflow:hidden;border-radius:20px;margin-top:24px;background:#241a1d}.scene{position:absolute;inset:0;background-position:center;background-size:cover;opacity:0;transform:translateY(65px) scale(.92);filter:blur(9px);transition:opacity .65s ease,transform 1.05s cubic-bezier(.17,.82,.19,1),filter .8s}.scene.active{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}.stage:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#130e12bb,transparent 30%,#130e1255);pointer-events:none}.nav{position:absolute;z-index:2;top:45%;background:#100d1099;border:1px solid #fff8;border-radius:50%;color:white;width:44px;height:44px;font-size:25px;cursor:pointer}.prev{left:12px}.next{right:12px}.count{position:absolute;z-index:2;right:20px;top:18px;font:12px Arial;letter-spacing:3px}.caption{position:absolute;z-index:2;bottom:25px;left:0;right:0;font:26px Georgia;text-shadow:0 2px 10px #000}.choices{display:flex;gap:10px;overflow:auto;padding:20px 3px 8px;scrollbar-width:thin}.choice{flex:1;min-width:145px;background:#21191c;border:1px solid #6e5658;border-radius:12px;color:#eee;padding:0 0 12px;overflow:hidden;cursor:pointer}.choice.active{border-color:#f5d4c6;box-shadow:0 0 0 1px #f5d4c6}.choice img{width:100%;height:100px;object-fit:cover;display:block;margin-bottom:12px}.choice strong{font:15px Georgia}.note{color:#b9a9a8;font-size:11px;line-height:1.6;margin-top:18px}@media(max-width:600px){h1{font-size:35px}.stage{height:490px}.choice{min-width:125px}.choice img{height:85px}}</style></head><body><main class="page"><a class="back" href="/">← Winess Signature</a><h1>Cocktail Atelier</h1><div class="sub">CHOISISSEZ VOTRE COCKTAIL</div><section class="stage" id="stage"><div class="scene active" id="scene0"></div><div class="scene" id="scene1"></div><span class="count" id="count">01 / 04</span><button class="nav prev" id="prev" aria-label="Cocktail précédent">‹</button><button class="nav next" id="next" aria-label="Cocktail suivant">›</button><div class="caption" id="caption">Porn Star Martini</div></section><div class="choices" id="choices"></div><div class="note">DÉMONSTRATION PHOTO INTERACTIVE · WINESS SIGNATURE</div></main><script>const drinks=[{name:'Porn Star Martini',photo:'https://assets.simpleviewinc.com/simpleview/image/upload/c_fill%2Ch_800%2Cq_75%2Cw_1980/v1/clients/denton/girl_holding_a_craft_cocktail_in_a_hotel_bar_late_2023_11_27_05_11_42_utc_ca9cde55-50dc-4b24-9f32-fc60be32d039.jpg'},{name:'Margarita',photo:'https://www.lecerclebypernodricard.com/media/wysiwyg/global-landing/OriginalSizeJPEG-Livraison_1080x1350-min_1.jpg?rand=1746688962'},{name:'Moscow Mule',photo:'https://www.mrconnoisseur.com/uploads/the-4-best-speakeasy-bars-new-york-1.jpg'},{name:'Espresso Martini',photo:'https://d3k81ch9hvuctc.cloudfront.net/company/RbzxT4/images/a8a0c869-1edb-49ac-ae51-e445b41e178c.jpeg'}];let index=0,layer=0;const scenes=[document.getElementById('scene0'),document.getElementById('scene1')],choices=document.getElementById('choices');drinks.forEach((d,i)=>{const b=document.createElement('button');b.className='choice'+(i===0?' active':'');b.innerHTML='<img loading="lazy" alt="" src="'+d.photo+'"><strong>'+d.name+'</strong>';b.onclick=()=>show(i);choices.appendChild(b)});scenes[0].style.backgroundImage='url("'+drinks[0].photo+'")';function show(n){if(n===index)return;const other=1-layer;scenes[other].style.transition='none';scenes[other].classList.remove('active');scenes[other].style.backgroundImage='url("'+drinks[n].photo+'")';void scenes[other].offsetWidth;scenes[other].style.transition='';scenes[layer].classList.remove('active');scenes[other].classList.add('active');layer=other;index=n;document.getElementById('caption').textContent=drinks[n].name;document.getElementById('count').textContent=String(n+1).padStart(2,'0')+' / 04';[...choices.children].forEach((b,i)=>b.classList.toggle('active',i===n))}document.getElementById('prev').onclick=()=>show((index+3)%4);document.getElementById('next').onclick=()=>show((index+1)%4);let start=0;document.getElementById('stage').addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});document.getElementById('stage').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-start;if(Math.abs(d)>50)show((index+(d<0?1:3))%4)},{passive:true});</script></body></html>
