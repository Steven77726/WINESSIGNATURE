<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Démo Cocktails | Winess Signature</title><style>*{box-sizing:border-box}body{margin:0;background:#100d10;color:#f4ece9;font-family:Arial,sans-serif}.wrap{max-width:960px;margin:auto;padding:24px 14px;text-align:center}h1{font:italic 46px Georgia;margin:15px 0 4px}p{letter-spacing:3px;font-size:11px;color:#d5bcb4}.scene{height:min(66vh,560px);min-height:390px;position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 60% 40%,#72504d 0%,#281c20 55%,#100d10 100%)}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 83% 19%,#d68e4b55,transparent 8%),radial-gradient(circle at 90% 55%,#e6a45a44,transparent 10%);filter:blur(10px)}.hand{position:absolute;width:110%;height:100%;left:-10%;bottom:-12%;pointer-events:none}.glass{position:absolute;width:min(34vw,190px);height:270px;left:52%;top:7%;transform:translateX(-50%);filter:drop-shadow(0 12px 10px #0009);transition:opacity .3s,transform .55s cubic-bezier(.2,.8,.2,1)}.glass.leave{opacity:0;transform:translate(-50%,-95px) rotate(12deg)}.glass.enter{animation:arrive .8s cubic-bezier(.16,1,.3,1)}@keyframes arrive{from{opacity:0;transform:translate(-50%,170px) rotate(-13deg) scale(.55)}to{opacity:1;transform:translate(-50%,0) rotate(0) scale(1)}}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.choice{background:#231b1d;color:#eee;border:1px solid #775c54;border-radius:12px;padding:14px 16px;cursor:pointer;min-width:135px}.choice.active{border-color:#e6b9a2;box-shadow:0 0 16px #e6b9a244}.choice span{display:block;font-size:28px;margin-bottom:7px}.nav{position:absolute;top:47%;border:1px solid #bda5a0;background:#2c1e20aa;color:white;border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer}.prev{left:12px}.next{right:12px}.back{color:#dbc5bc;font-size:13px;text-decoration:none}.name{font:28px Georgia;margin-top:14px}@media(max-width:520px){h1{font-size:34px}.glass{width:165px;top:12%}.scene{height:440px}.choice{min-width:44%;padding:12px 7px}}</style></head><body><main class="wrap"><a class="back" href="/">← Winess Signature</a><h1>Cocktail Atelier</h1><p>CHOISISSEZ VOTRE COCKTAIL</p><div class="scene"><svg class="hand" viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="skin" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#925441"/><stop offset=".5" stop-color="#e9ac90"/><stop offset="1" stop-color="#ffcfb1"/></linearGradient></defs><path d="M-40 535 Q160 500 260 405 Q330 350 425 355 Q530 366 606 318 L750 218 Q774 202 785 220 Q794 237 771 255 L689 330 L809 251 Q836 234 846 253 Q855 270 831 291 L727 374 L859 310 Q885 296 893 319 Q897 339 870 355 L744 450 Q667 507 565 482 Q450 468 361 503 L145 610Z" fill="url(#skin)" stroke="#bd806e" stroke-width="3"/><path d="M268 409 Q300 426 318 459" fill="none" stroke="#b77c68" stroke-width="4"/><path d="M236 438 Q253 447 272 472" stroke="#ddd0c4" stroke-width="11"/><path d="M238 442 Q256 450 273 475" stroke="#fff9" stroke-width="3" stroke-dasharray="2 9"/><path d="M770 218 Q782 207 789 219 L780 235 L764 231Z M832 250 Q847 245 851 258 L839 274 L823 269Z M878 313 Q894 312 895 328 L877 344 L864 334Z" fill="#75172d"/></svg><div id="glass" class="glass"></div><button class="nav prev" id="prev" aria-label="Précédent">‹</button><button class="nav next" id="next" aria-label="Suivant">›</button></div><div class="name" id="name">Porn Star Martini</div><div class="choices" id="choices"></div><p>DÉMONSTRATION INTERACTIVE • WINESS SIGNATURE</p></main><script>const data=[['Porn Star Martini','#ed972a','🍸'],['Margarita','#e2dc89','🍋'],['Moscow Mule','#ba6e40','🍹'],['Espresso Martini','#573328','☕']];let i=0,busy=false;const glass=document.getElementById('glass'),choices=document.getElementById('choices');function svg(c,mule){return '<svg viewBox="0 0 190 270" width="100%" height="100%"><defs><linearGradient id="liquid" x2=".8" y2="1"><stop stop-color="'+c+'"/><stop offset="1" stop-color="'+c+'" stop-opacity=".75"/></linearGradient></defs>'+(mule?'<path d="M45 55 H140 L131 207 Q95 223 57 207Z" fill="url(#liquid)" stroke="#dca37d" stroke-width="5"/><path d="M139 80 Q190 60 178 131 Q171 159 136 151" fill="none" stroke="#c78959" stroke-width="13"/><ellipse cx="93" cy="56" rx="48" ry="9" fill="#e4b18a"/>':'<path d="M20 55 Q26 140 95 149 Q164 140 170 55Z" fill="url(#liquid)" stroke="#ffffffa9" stroke-width="3"/><ellipse cx="95" cy="55" rx="75" ry="12" fill="'+c+'" stroke="#ffffffb9" stroke-width="4"/><path d="M95 149 V241 M95 241 L44 254 H146" fill="none" stroke="#ffffffb5" stroke-width="6"/>')+'</svg>'}function draw(){glass.innerHTML=svg(data[i][1],i===2);document.getElementById('name').textContent=data[i][0];[...choices.children].forEach((b,j)=>b.classList.toggle('active',i===j))}function change(n){if(busy||n===i)return;busy=true;glass.className='glass leave';setTimeout(()=>{i=n;draw();glass.className='glass enter';setTimeout(()=>{glass.className='glass';busy=false},850)},320)}data.forEach((d,j)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span>'+d[2]+'</span>'+d[0];b.onclick=()=>change(j);choices.appendChild(b)});document.getElementById('prev').onclick=()=>change((i+3)%4);document.getElementById('next').onclick=()=>change((i+1)%4);let x=0;document.querySelector('.scene').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});document.querySelector('.scene').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)change((i+(d<0?1:3))%4)},{passive:true});draw();</script></body></html>
